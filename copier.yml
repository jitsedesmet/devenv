# Copier configuration for the personal devcontainer template.
# https://copier.readthedocs.io/en/stable/configuring/

# Only the files under `template/` are rendered into the destination project,
# so this repo can keep its own README, LICENSE and CI at the root.
_subdirectory: template

# Require a Copier version that supports the update workflow used here.
_min_copier_version: "9.0.0"

# ----------------------------------------------------------------------------
# Questions
# ----------------------------------------------------------------------------

name:
  type: str
  help: The devcontainer name (shown in your editor / IDE).
  default: "{{ _copier_conf.dst_path.name }}"

setup_type:
  type: str
  help: What kind of devcontainer setup do you want?
  choices:
    Node.js: node
    Java (JDK + Maven, ready to build Apache Jena): java
  default: node

# Git identity baked into the container's global git config, so commits made
# inside it (by you or by an agent) are authored by you. Leave empty to skip
# and configure git yourself. Answers are recorded in .copier-answers.yml, so
# consider your GitHub noreply address if the repository is public.
git_user_name:
  type: str
  help: Your name for git commits made in the devcontainer (git config user.name). Leave empty to skip.
  default: ""

git_user_email:
  type: str
  help: Your email for git commits made in the devcontainer (git config user.email), e.g. your GitHub noreply address. Leave empty to skip.
  default: ""
  validator: >-
    {% if git_user_email and (git_user_email.count('@') != 1 or git_user_email.split() | length != 1) %}
    Enter a single email address (like you@example.com), or leave it empty.
    {% endif %}

# Not asked; derived from setup_type so both the Dockerfile and
# devcontainer.json can key off a single value for the container's
# unprivileged user. `node:22` ships a ready-made `node` user at UID/GID
# 1000; the Java base image (Ubuntu Noble) ships its own ready-made user
# at UID/GID 1000 too, just named `ubuntu` instead.
container_user:
  type: str
  when: false
  default: "{{ 'node' if setup_type == 'node' else 'ubuntu' }}"
